<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plafond</title>
<meta name="description" content="Controla os gastos do mês sem passar do plafond.">
<meta name="theme-color" content="#ececef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1012" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plafond">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: single-column phone app (max 480px), sticky header, docked tab bar, bottom sheets.
   Lime hero card over a graphite card, light modular rows below — from the Figma "Neo-Fintech" mockups. */
:root{
  --bg:#ececef; --surface:#ffffff; --surface-2:#e6e6eb; --ink:#1a1c1f; --muted:#62646a; --faint:#8d8f96;
  --line:rgba(26,28,31,.08); --header:rgba(246,246,250,.86);
  --lime:#d2ff1e; --on-lime:#171e00; --lime-soft:rgba(210,255,30,.22);
  --graphite:#2f3034; --g-ink:#e8e8ea; --g-muted:#a3a3a8; --g-track:#222327; --g-soft:rgba(255,255,255,.07);
  --night:#141517; --on-night:#ffffff;
  --warn:#f2a01c; --warn-2:#e07f0c; --on-warn:#1f1300;
  --danger:#c4281c; --danger-soft:#ffdcd7; --on-danger-soft:#8f1b12;
  --shadow:0 2px 6px rgba(0,0,0,.035);
  --f-display:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1012; --surface:#1a1b1f; --surface-2:#26272c; --ink:#f1f1f3; --muted:#a0a2a9; --faint:#74767d;
  --line:rgba(255,255,255,.07); --header:rgba(15,16,18,.86);
  --graphite:#232428; --g-track:#16171a; --night:#2a2b31; --danger-soft:#3b1714; --on-danger-soft:#ffb4ab;
  --shadow:0 2px 6px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1012; --surface:#1a1b1f; --surface-2:#26272c; --ink:#f1f1f3; --muted:#a0a2a9; --faint:#74767d;
  --line:rgba(255,255,255,.07); --header:rgba(15,16,18,.86);
  --graphite:#232428; --g-track:#16171a; --night:#2a2b31; --danger-soft:#3b1714; --on-danger-soft:#ffb4ab;
  --shadow:0 2px 6px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:space-between;padding:14px 20px 12px;box-shadow:0 1px 8px rgba(0,0,0,.04)}
.brand{display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.top h1{margin:0;font-family:var(--f-body);font-weight:700;font-size:18px;letter-spacing:-.01em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border-radius:999px;padding:4px 10px;font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.pill svg.i{width:12px;height:12px}

main{padding:10px 20px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}

/* hero */
.stack{position:relative;display:flex;flex-direction:column;gap:8px}
.hero{border-radius:28px;padding:24px 24px 26px;display:flex;flex-direction:column;gap:16px;background:var(--lime);color:var(--on-lime);box-shadow:0 4px 24px rgba(210,255,30,.22)}
.hero.warn{background:linear-gradient(160deg,var(--warn),var(--warn-2));color:var(--on-warn);box-shadow:0 4px 24px rgba(242,160,28,.25)}
.hero.over{background:var(--danger-soft);color:var(--on-danger-soft);box-shadow:none}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:4px 11px;background:rgba(0,0,0,.1);font-weight:700;font-size:11.5px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.hero.warn .status{background:var(--night);color:#fff}.hero.warn .status::before{background:var(--warn)}
.hero.over .status{background:var(--danger);color:#fff}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(40px,12vw,48px);letter-spacing:-.05em;line-height:1;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
.big small{font-size:.58em;letter-spacing:0}
.hero .label{opacity:.85}
.bar{height:6px;border-radius:999px;background:rgba(0,0,0,.1);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:999px;background:currentColor;transition:width .5s ease}
.hero.over .bar>span{background:var(--danger)}
.hero-foot{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:600;opacity:.85;margin-top:-6px}

.dark{background:var(--graphite);color:var(--g-ink);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 8px 30px rgba(0,0,0,.16)}
.dark .eyebrow,.dark .sub{color:var(--g-muted)}
.sub{font-size:11.5px;font-weight:500}
.knot{position:absolute;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:var(--night);color:#fff;border:3px solid var(--bg);display:grid;place-items:center;z-index:1}
.knot svg.i{width:13px;height:13px}
.pace{display:flex;gap:12px;align-items:center;background:var(--g-soft);border-radius:16px;padding:12px}
.pace .ic{width:32px;height:32px;border-radius:50%;background:rgba(210,255,30,.14);color:var(--lime);display:grid;place-items:center}
.pace.warn .ic{background:rgba(242,160,28,.16);color:var(--warn)}
.pace.over .ic{background:rgba(255,100,90,.16);color:#ff8a80}
.pace b{display:block;font-size:16px;color:#fff;font-weight:700;letter-spacing:-.01em}
.cats{display:flex;flex-direction:column;gap:14px}
.crow{display:flex;flex-direction:column;gap:7px}
.crow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px}
.crow-top span:first-child{display:flex;align-items:center;gap:8px;font-weight:500}
.crow-top .v{font-family:var(--f-display);font-weight:600;color:#fff;white-space:nowrap}
.crow-top .v em{font-style:normal;color:var(--g-muted);font-weight:500;font-size:11.5px;margin-left:6px}
.track{height:4px;border-radius:999px;background:var(--g-track);overflow:hidden}
.track>span{display:block;height:100%;border-radius:999px}
.empty-dark{color:var(--g-muted);font-size:13px;padding:4px 0}

/* lists */
.sec-head{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 0}
.sec-head .eyebrow{color:var(--muted)}
.link{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:10px}
.mv{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.mv .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.mv .txt{flex:1;min-width:0}
.mv .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .m{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px;min-width:0}
.dot{width:4px;height:4px;border-radius:50%;background:var(--faint);opacity:.6;flex:none}
.tag{background:var(--surface-2);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:600;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .a{font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px;box-shadow:var(--shadow)}
.note .ic{width:40px;height:40px;border-radius:12px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;flex:none}
.note b{display:block;font-size:14px;margin-bottom:3px}
.note p{margin:0;color:var(--muted);font-size:12.5px}
.note p strong{color:var(--ink)}
.blank{background:var(--surface);border-radius:20px;padding:28px 22px;text-align:center;color:var(--muted);box-shadow:var(--shadow)}
.blank b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* FAB + nav */
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--night);color:var(--lime);display:grid;place-items:center;box-shadow:0 8px 18px rgba(0,0,0,.25);z-index:6}
.fab svg.i{width:22px;height:22px;stroke-width:2.4}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--header);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{max-width:480px;margin:0 auto;display:flex;justify-content:space-around;height:64px;align-items:center}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:72px;padding:6px;color:var(--muted);font-family:var(--f-display);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;position:relative}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"]::after{content:"";position:absolute;top:-1px;width:18px;height:3px;border-radius:0 0 3px 3px;background:var(--lime)}

/* history */
.sum{background:var(--graphite);color:var(--g-ink);border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px}
.sum .big{color:var(--lime);font-size:clamp(36px,10vw,42px)}
.sum .big i{font-style:normal;font-family:var(--f-body);font-size:11px;letter-spacing:.04em;color:var(--g-muted);text-transform:uppercase;font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid rgba(255,255,255,.08);padding-top:14px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio .eyebrow{font-size:10px;color:var(--g-muted)}
.trio b{font-family:var(--f-display);font-size:15px;color:#fff;white-space:nowrap}
.trio b.l{color:var(--lime)}
.cyc-pill{background:rgba(210,255,30,.14);color:var(--lime);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.cyc-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.search input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:7px 14px;background:var(--surface-2);font-size:12.5px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--night);color:#fff}
.chip svg.i{width:14px;height:14px}
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;justify-content:space-between;padding:6px 4px 0;color:var(--muted)}
.ghead .eyebrow{font-size:11px}
.ghead span:last-child{font-size:12px;font-weight:600}

/* settings */
.profile{background:var(--graphite);color:var(--g-ink);border-radius:28px;padding:24px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
.profile .eyebrow{color:var(--g-muted);font-size:10.5px}
.profile .pv{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--lime);letter-spacing:-.03em}
.profile .pv.w{color:#fff;font-size:20px}
.grp{display:flex;flex-direction:column;gap:8px}
.grp>.eyebrow{color:var(--muted);padding:0 4px;font-size:11px}
.panel{background:var(--surface);border-radius:20px;padding:4px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:14px;padding:14px 12px;width:100%;text-align:left;border-radius:16px}
.row+.row{border-top:1px solid var(--line);border-radius:0 0 16px 16px}
.row .ic{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.row .ic.l{background:var(--lime);color:var(--on-lime)}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:15px;font-weight:600}
.row .txt span{color:var(--muted);font-size:12px}
.row .val{font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.row .val svg.i{width:14px;height:14px;color:var(--faint)}
.row.danger{color:var(--danger)}
.row.danger .ic{background:var(--danger-soft);color:var(--danger)}
.switch{width:48px;height:28px;border-radius:999px;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--lime)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--night)}
.foot{text-align:center;color:var(--faint);font-size:11.5px;padding:6px 0}

/* onboarding */
.ob{max-width:480px;margin:0 auto;min-height:100%;padding:16px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.steps{display:flex;flex-direction:column;gap:10px}
.steps-top{display:flex;justify-content:space-between;align-items:center}
.steps-top .eyebrow{display:flex;align-items:center;gap:6px;font-size:11px}
.steps-top .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
.steps-top .r{color:#5f7a00;font-size:11px}
:root[data-theme="dark"] .steps-top .r{color:var(--lime)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .steps-top .r{color:var(--lime)}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg span{height:6px;border-radius:999px;background:var(--surface-2)}
.seg span.on{background:var(--lime);box-shadow:0 0 10px rgba(210,255,30,.5)}
.ob h2{font-family:var(--f-body);font-weight:700;font-size:clamp(28px,8vw,34px);line-height:1.08;letter-spacing:-.03em;margin:0;text-wrap:balance}
.ob .lead{color:var(--muted);font-size:15px;margin:6px 0 0}
.limecard{background:var(--lime);color:var(--on-lime);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.limecard .big{font-size:44px}
.caret{display:inline-block;width:2px;height:.85em;background:currentColor;margin-left:4px;animation:blink 1s steps(1) infinite;align-self:center}
@keyframes blink{50%{opacity:0}}
.limecard .meta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;font-weight:600}
.limecard .meta i{font-style:normal;background:rgba(0,0,0,.1);border-radius:999px;padding:2px 9px;font-size:11px}
.sugg{display:flex;flex-direction:column;gap:8px}
.sugg .eyebrow{color:var(--muted);font-size:11px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:52px;border-radius:999px;background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:24px;box-shadow:var(--shadow);transition:transform .08s,background .15s}
.keypad button:active{transform:scale(.96);background:var(--surface-2)}
.keypad button.soft{background:var(--surface-2);font-size:18px}
.keypad button.c{color:var(--danger);font-size:18px}
.keypad svg.i{width:22px;height:22px;margin:auto}
.cta{display:flex;align-items:center;justify-content:space-between;width:100%;height:64px;border-radius:999px;background:var(--night);color:#fff;padding:0 16px 0 24px;font-size:17px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.cta .go{width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center}
.cta.lime{background:var(--lime);color:var(--on-lime)}.cta.lime .go{background:var(--night);color:var(--lime)}
.cta:disabled{opacity:.45;cursor:not-allowed}
.hint{text-align:center;color:var(--muted);font-size:12.5px;margin:-6px 0 0}
.paycard{background:var(--graphite);color:var(--g-ink);border-radius:24px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.paycard .k{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:999px;padding:3px 10px;color:var(--lime);font-family:var(--f-display);font-weight:700;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.paycard .k::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.paycard .d{font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--lime);margin:6px 0 2px}
.paycard .d small{font-size:11px;color:var(--g-muted);letter-spacing:.08em;margin-right:8px}
.paycard .s{color:var(--g-muted);font-size:12.5px}
.paycard .bub{width:48px;height:48px;border-radius:50%;background:rgba(210,255,30,.16);color:var(--lime);display:grid;place-items:center}
.days{background:var(--surface);border-radius:24px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.days-head{display:flex;justify-content:space-between;align-items:center}
.days-head .eyebrow{color:var(--muted);font-size:11px}
.days-head i{font-style:normal;background:var(--lime-soft);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dgrid button{height:38px;border-radius:10px;background:var(--surface-2);font-family:var(--f-display);font-weight:600;font-size:14px}
.dgrid button[aria-pressed="true"]{background:var(--lime);color:var(--on-lime);box-shadow:0 4px 12px rgba(210,255,30,.45);font-weight:700}
.info{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:20px;padding:16px}
.info .ic{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.info b{font-size:13px;display:block}
.info span{color:var(--muted);font-size:13px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cbtn{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:16px;padding:10px 12px;background:var(--surface-2);text-align:left;min-width:0}
.cbtn .ic{width:32px;height:32px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.cbtn b{flex:1;font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbtn .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center}
.cbtn[aria-pressed="true"]{background:var(--graphite);color:#fff}
.cbtn[aria-pressed="true"] .ic{background:rgba(210,255,30,.16);color:var(--lime)}
.cbtn[aria-pressed="true"] .ck{border-color:var(--lime);color:var(--lime)}
.cbtn .ck svg.i{width:12px;height:12px;stroke-width:3;opacity:0}
.cbtn[aria-pressed="true"] .ck svg.i{opacity:1}
.addcat{display:flex;gap:8px}
.addcat input{flex:1;min-width:0;border:0;border-radius:14px;background:var(--surface-2);padding:13px 14px;outline:none}
.addcat button{border-radius:14px;background:var(--night);color:#fff;padding:0 16px;font-weight:600;white-space:nowrap}
.cnt{display:inline-flex;gap:5px;align-items:center;background:var(--lime);color:var(--on-lime);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;white-space:nowrap}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{width:100%;max-width:480px;max-height:94%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--faint);opacity:.5;margin:2px auto 0}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-head h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.ghost{border-radius:999px;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.amt{background:var(--lime);color:var(--on-lime);border-radius:24px;padding:16px 20px 20px;display:flex;flex-direction:column;gap:6px}
.amt .big{justify-content:center;font-size:46px}
.amt .row2{display:flex;justify-content:space-between;align-items:center}
.field{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:4px 14px;min-height:48px}
.field input{flex:1;min-width:0;border:0;background:none;outline:none;padding:10px 0}
.field input::placeholder{color:var(--faint)}
.field .lab{color:var(--muted);font-size:13px}
.field .right{margin-left:auto;font-weight:700;font-size:13px;display:flex;align-items:center;gap:4px;position:relative}
.field .right input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.sheet .keypad button{height:48px;font-size:22px}
.err{color:var(--danger);font-size:12.5px;text-align:center;margin:-4px 0 0;min-height:1em}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--danger-soft);color:var(--on-danger-soft);border-radius:18px;padding:16px}
.confirm div{display:flex;gap:8px}
.confirm button{flex:1;border-radius:999px;padding:11px;font-weight:700}
.confirm .y{background:var(--danger);color:#fff}
.confirm .n{background:var(--surface)}
.btn-row{display:flex;gap:8px}
.btn-row button{flex:1;border-radius:999px;padding:13px;font-weight:600;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:30;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:fade .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="root"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
(function(){
"use strict";
/* ---------- icons ---------- */
const P={
 wallet:'M3 7a2 2 0 0 1 2-2h12v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14.5h.01',
 home:'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
 food:'M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M18 3c-2 0-3.5 2-3.5 6s1.5 4 3.5 4M18 3v18',
 bus:'M6 3h12a2 2 0 0 1 2 2v12H4V5a2 2 0 0 1 2-2zM4 11h16M7 17v3M17 17v3M8 14h.01M16 14h.01',
 heart:'M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.2a4.2 4.2 0 0 1 7.5 2.6C19.5 15.4 12 20 12 20z',
 smoke:'M3 14h13v4H3zM16 14h2.5v4H16zM21 14v4M17 3.5c0 2-2 2-2 4s2 2 2 4M20.5 4.5c0 1.6-1.5 1.8-1.5 3.3',
 bag:'M5.5 8h13l-1 13h-11zM9 8V6.5a3 3 0 0 1 6 0V8',
 plane:'M10.5 13.5 3 11l1.5-1.5 7 1 4.5-4.5a2.1 2.1 0 0 1 3 3L14.5 13.5l1 7L14 22l-2.5-7z',
 play:'M3 7h18v13H3zM7 3.5h10M10.5 11v5.5l4.2-2.75z',
 tag:'M3 12V4h8l10 10-8 8zM7.5 7.5h.01',
 gift:'M4 11h16v10H4zM3 7h18v4H3zM12 7v14M12 7S10.5 3 8 3a2 2 0 0 0 0 4M12 7s1.5-4 4-4a2 2 0 0 1 0 4',
 paw:'M12 13c-3 0-5 3-5 5.5 0 1.4 1.2 2 2.5 2 1 0 1.6-.5 2.5-.5s1.5.5 2.5.5c1.3 0 2.5-.6 2.5-2 0-2.5-2-5.5-5-5.5zM6 9.5a1.5 2 0 1 0 0 .1M18 9.5a1.5 2 0 1 0 0 .1M9.5 5.5a1.5 2 0 1 0 0 .1M14.5 5.5a1.5 2 0 1 0 0 .1',
 book:'M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2zM4 20a2 2 0 0 0 2 2h13v-4',
 receipt:'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3',
 sliders:'M4 7h9M17 7h3M15 5v4M4 17h3M11 17h9M9 15v4',
 plus:'M12 5v14M5 12h14', arrow:'M5 12h14M13 6l6 6-6 6', ne:'M7 17 17 7M9 7h8v8',
 back:'M15 6l-6 6 6 6', chev:'M9 6l6 6-6 6', check:'M5 12.5l4.5 4.5L19 7',
 cal:'M4 6h16v15H4zM4 10h16M8 3v4M16 3v4', bs:'M9 5h11v14H9l-6-7zM12.5 9.5l5 5M17.5 9.5l-5 5',
 search:'M11 4a7 7 0 1 1 0 14 7 7 0 0 1 0-14zM16 16l5 5', note:'M4 6h16M4 12h10M4 18h7',
 trash:'M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13', pen:'M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4',
 bell:'M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4', grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
 euro:'M17.5 6.5A7 7 0 1 0 17.5 17.5M4 10h9M4 14h9', moon:'M20 14.5A8.5 8.5 0 1 1 9.5 4 7 7 0 0 0 20 14.5z',
 down:'M12 4v11M7 10l5 5 5-5M5 20h14', up:'M12 20V9M7 14l5-5 5 5M5 4h14',
 pace:'M3 17l6-6 4 4 8-8M15 7h6v6', clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2',
 alert:'M12 3 2 20h20zM12 10v4M12 17h.01', info:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01'
};
const ic=(n,cls)=>`<svg class="i${cls?' '+cls:''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]||P.tag}"/></svg>`;

const PRESETS=[
 {id:'casa',nome:'Casa e contas',icon:'home'},{id:'alim',nome:'Alimentação',icon:'food'},
 {id:'transp',nome:'Transportes',icon:'bus'},{id:'saude',nome:'Saúde e lazer',icon:'heart'},
 {id:'tabaco',nome:'Tabaco',icon:'smoke'},{id:'compras',nome:'Compras',icon:'bag'},
 {id:'viagens',nome:'Viagens',icon:'plane'},{id:'subs',nome:'Subscrições',icon:'play'}
];
const DEFAULT_ON=['casa','alim','transp','saude','tabaco'];

/* ---------- utils ---------- */
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>`${y}-${pad(m)}-${pad(d)}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return{y,m,d}};
const dim=(y,m)=>new Date(y,m,0).getDate();
const todayISO=()=>{const t=new Date();return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
const addDays=(s,n)=>{const {y,m,d}=parse(s);const t=new Date(y,m-1,d+n);return iso(t.getFullYear(),t.getMonth()+1,t.getDate())};
const daysBetween=(a,b)=>{const A=parse(a),B=parse(b);return Math.round((new Date(B.y,B.m-1,B.d)-new Date(A.y,A.m-1,A.d))/864e5)};
function cycleFor(s,dia){
  let {y,m,d}=parse(s);
  const sd=(yy,mm)=>Math.min(dia,dim(yy,mm));
  if(d<sd(y,m)){m--;if(m<1){m=12;y--}}
  const start=iso(y,m,sd(y,m));
  let ny=y,nm=m+1;if(nm>12){nm=1;ny++}
  const end=addDays(iso(ny,nm,sd(ny,nm)),-1);
  return{start,end};
}
const short=s=>{const {m,d}=parse(s);return `${d} ${MES[m-1]}`};
const rangeTxt=c=>`${short(c.start)} – ${short(c.end)}`;
function eur(v,sign){
  const neg=v<0;let s=Math.abs(v).toFixed(2);let [a,b]=s.split('.');
  a=a.replace(/\B(?=(\d{3})+(?!\d))/g,'.');
  return (neg?'−':(sign?'+':''))+a+','+b+' €';
}
const round2=v=>Math.round(v*100)/100;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function relDay(s){const t=todayISO();if(s===t)return'Hoje';if(s===addDays(t,-1))return'Ontem';return short(s)}

/* ---------- state + storage ---------- */
let S=null;              // {v,config:{plafond,dia,alerta,limiar,cats,tema},despesas:[]}
const LS='plafond-app-v1';
const ref=null;
function lsGet(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(LS,JSON.stringify(v))}catch(e){}}
function persist(){ lsSet(S); }
async function askPersist(){
  try{ if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){}
}
function normalize(x){
  if(!x||!x.config)return null;
  x.despesas=Array.isArray(x.despesas)?x.despesas:[];
  x.config.cats=Array.isArray(x.config.cats)?x.config.cats:[];
  if(typeof x.config.alerta!=='boolean')x.config.alerta=true;
  x.config.limiar=x.config.limiar||0.9;
  x.config.tema=x.config.tema||'auto';
  return x;
}

/* ---------- view state ---------- */
const V={tab:'inicio',ob:null,sheet:null,hist:{cyc:null,cat:'all',q:''},toast:null};
const root=document.getElementById('root');
const cats=()=>S.config.cats;
const catById=id=>cats().find(c=>c.id===id)||{id,nome:'Outros',icon:'tag'};

function applyTheme(){
  const t=S&&S.config.tema;
  const el=document.documentElement;
  if(t==='claro')el.setAttribute('data-theme','light');
  else if(t==='escuro')el.setAttribute('data-theme','dark');
  else if(el.dataset.mine)el.removeAttribute('data-theme');
  if(t==='claro'||t==='escuro')el.dataset.mine='1';
}

function compute(c){
  const items=S.despesas.filter(x=>x.data>=c.start&&x.data<=c.end);
  const total=round2(items.reduce((a,x)=>a+x.valor,0));
  const by={};items.forEach(x=>{by[x.cat]=round2((by[x.cat]||0)+x.valor)});
  return{items,total,by};
}

/* ---------- render ---------- */
function render(){
  applyTheme();
  if(!S||V.ob){root.innerHTML=renderOnboarding();bindOnboarding();return}
  const titles={inicio:'Início',historico:'Histórico',definicoes:'Definições'};
  const cur=cycleFor(todayISO(),S.config.dia);
  let body='';
  if(V.tab==='inicio')body=renderHome(cur);
  else if(V.tab==='historico')body=renderHistory(cur);
  else body=renderSettings(cur);
  root.innerHTML=`<div class="app">
   <header class="top"><div class="brand"><span class="badge">${ic('wallet')}</span><h1>${titles[V.tab]}</h1></div>
    <span class="pill">${ic('cal')}${rangeTxt(cur)}</span></header>
   <main id="main">${body}</main>
   <button class="fab" data-act="add" aria-label="Registar gasto">${ic('plus')}</button>
   <nav class="nav"><div>
    ${[['inicio','wallet','Início'],['historico','receipt','Histórico'],['definicoes','sliders','Definições']].map(([k,i,l])=>
      `<button data-tab="${k}" ${V.tab===k?'aria-current="page"':''}>${ic(i)}${l}</button>`).join('')}
   </div></nav>
   ${V.sheet?renderSheet():''}
   ${V.toast?`<div class="toast" role="status">${esc(V.toast)}</div>`:''}
  </div>`;
  bindApp();
}

function renderHome(cur){
  const {items,total,by}=compute(cur);
  const pl=S.config.plafond, rest=round2(pl-total), pct=pl?total/pl:0;
  const t=todayISO(), left=Math.max(1,daysBetween(t,cur.end)+1);
  const warnOn=S.config.alerta;
  const state=pct>1?'over':(warnOn&&pct>=S.config.limiar?'warn':'ok');
  const status={ok:'Dentro do plafond',warn:`Atenção · ${Math.round(S.config.limiar*100)}% atingido`,over:'Plafond ultrapassado'}[state];
  const pctTxt=(pct*100).toFixed(pct>1&&pct<1.1?1:0).replace('.',',')+'% consumido';
  const hero=`<section class="hero ${state==='ok'?'':state}">
     <div class="hero-row"><span class="eyebrow label">${state==='over'?'Já gastaste a mais':'Disponível'}</span><span class="status">${status}</span></div>
     <div class="big">${eur(Math.abs(rest)).replace(' €','').replace('−','')}<small>€</small></div>
     <div class="bar" role="progressbar" aria-valuenow="${Math.round(pct*100)}" aria-valuemin="0" aria-valuemax="100" aria-label="Plafond usado"><span style="width:${Math.min(100,pct*100).toFixed(1)}%"></span></div>
     <div class="hero-foot"><span>${eur(total)} de ${eur(pl)}</span><span>${pctTxt}</span></div>
   </section>`;
  const sorted=cats().map(c=>({c,v:by[c.id]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  // categories not in config (removed later) still count
  Object.keys(by).forEach(k=>{if(!cats().some(c=>c.id===k))sorted.push({c:catById(k),v:by[k]})});
  const max=sorted.length?sorted[0].v:0;
  const barCol=i=>state==='over'?'#ff6b5e':state==='warn'?'var(--warn)':(i<2?'var(--lime)':'var(--g-muted)');
  const paceTxt=state==='over'
    ?`<span class="sub">Plafond ultrapassado</span><b>${eur(-rest).replace('−','')} acima · ${left} ${left===1?'dia':'dias'} para fechar</b>`
    :`<span class="sub">Ritmo sugerido</span><b>Restam ${eur(rest)} para ${left} ${left===1?'dia':'dias'}</b>`;
  const dark=`<section class="dark">
     <div class="pace ${state==='ok'?'':state}"><span class="ic">${ic(state==='over'?'alert':'clock')}</span><div>${paceTxt}</div></div>
     <div class="hero-row"><span class="eyebrow">Por categoria</span><span class="sub">${sorted.length?'Gasto acumulado':''}</span></div>
     ${sorted.length?`<div class="cats">${sorted.map((x,i)=>`<div class="crow">
        <div class="crow-top"><span>${esc(x.c.nome)}</span><span class="v">${eur(x.v)}<em>${total?Math.round(x.v/total*100):0}%</em></span></div>
        <div class="track"><span style="width:${(x.v/max*100).toFixed(1)}%;background:${barCol(i)}"></span></div></div>`).join('')}</div>`
      :`<div class="empty-dark">Ainda sem gastos neste ciclo. Toca em + para registar o primeiro.</div>`}
   </section>`;
  const recent=[...items].sort((a,b)=>b.data.localeCompare(a.data)||b.ts-a.ts).slice(0,5);
  const list=recent.length?`<div class="list">${recent.map(mvRow).join('')}</div>`
    :`<div class="blank"><b>Sem movimentos</b>Regista um gasto com o botão + e ele aparece aqui.</div>`;
  const daily=rest>0?round2(rest/left):0;
  const note=state==='over'
    ?`<div class="note"><span class="ic" style="background:var(--danger-soft);color:var(--danger)">${ic('alert')}</span><div><b>Plafond ultrapassado</b><p>Gastaste <strong>${eur(-rest).replace('−','')}</strong> acima do limite. O ciclo reinicia a ${short(addDays(cur.end,1))}.</p></div></div>`
    :`<div class="note"><span class="ic">${ic('pace')}</span><div><b>${state==='warn'?'Abranda o ritmo':'Ritmo diário confortável'}</b><p>Tens <strong>${eur(daily)}</strong> por dia durante ${left===1?'o último dia':`os próximos ${left} dias`} para fechar o ciclo dentro do plafond.</p></div></div>`;
  return `<div class="stack">${hero}<span class="knot" style="top:var(--kt,0)" aria-hidden="true">${ic('ne')}</span>${dark}</div>
   <div class="sec-head"><span class="eyebrow">Últimos movimentos</span>${items.length>5?`<button class="link" data-tab="historico">Ver todos</button>`:''}</div>
   ${list}${note}`;
}
function mvRow(x){
  const c=catById(x.cat);
  return `<button class="mv" data-edit="${x.id}"><span class="ic">${ic(c.icon)}</span>
   <span class="txt"><div class="t">${esc(x.desc||c.nome)}</div><div class="m"><span>${relDay(x.data)}</span><span class="dot"></span><span class="tag">${esc(c.nome)}</span></div></span>
   <span class="a">−${eur(x.valor)}</span></button>`;
}

function cyclesList(cur){
  const set=new Map();set.set(cur.start,cur);
  S.despesas.forEach(x=>{const c=cycleFor(x.data,S.config.dia);if(!set.has(c.start))set.set(c.start,c)});
  return [...set.values()].sort((a,b)=>b.start.localeCompare(a.start));
}
function renderHistory(cur){
  const list=cyclesList(cur);
  const sel=list.find(c=>c.start===V.hist.cyc)||cur;
  const {items,total,by}=compute(sel);
  const isCur=sel.start===cur.start;
  const elapsed=Math.max(1,Math.min(daysBetween(sel.start,todayISO()),daysBetween(sel.start,sel.end))+1);
  const maxG=items.reduce((a,x)=>Math.max(a,x.valor),0);
  const left=isCur?daysBetween(todayISO(),sel.end)+1:0;
  const q=V.hist.q.trim().toLowerCase();
  const fil=items.filter(x=>(V.hist.cat==='all'||x.cat===V.hist.cat)&&(!q||(x.desc||'').toLowerCase().includes(q)||catById(x.cat).nome.toLowerCase().includes(q)))
     .sort((a,b)=>b.data.localeCompare(a.data)||b.ts-a.ts);
  const groups=[];fil.forEach(x=>{let g=groups[groups.length-1];if(!g||g.d!==x.data){g={d:x.data,items:[]};groups.push(g)}g.items.push(x)});
  const used=Object.keys(by).sort((a,b)=>by[b]-by[a]);
  const over=total>S.config.plafond;
  return `${list.length>1?`<div class="chips" role="group" aria-label="Ciclo">${list.map(c=>`<button class="chip" data-cyc="${c.start}" aria-pressed="${c.start===sel.start}">${rangeTxt(c)}</button>`).join('')}</div>`:''}
   <section class="sum">
    <div class="hero-row"><span class="eyebrow" style="color:var(--g-muted)">${isCur?'Total registado no ciclo':'Ciclo fechado · '+rangeTxt(sel)}</span><span class="cyc-pill" ${over?'style="background:rgba(255,100,90,.16);color:#ff8a80"':''}>${items.length} ${items.length===1?'registo':'registos'}</span></div>
    <div class="big" ${over?'style="color:#ff8a80"':''}>${eur(total).replace(' €','')}<small>€</small> <i>de ${eur(S.config.plafond)}</i></div>
    <div class="trio"><div><span class="eyebrow">Média diária</span><b>${eur(round2(total/elapsed))}</b></div>
     <div><span class="eyebrow">Maior gasto</span><b>${eur(maxG)}</b></div>
     <div><span class="eyebrow">${isCur?'Dias restantes':'Resultado'}</span><b class="l" ${over?'style="color:#ff8a80"':''}>${isCur?left+(left===1?' dia':' dias'):(over?'Acima':'Dentro')}</b></div></div>
   </section>
   <label class="search">${ic('search')}<input id="q" type="search" placeholder="Pesquisar movimento ou categoria…" value="${esc(V.hist.q)}" aria-label="Pesquisar"></label>

   <div class="field">${ic('cal')}<span class="lab">Data</span><span class="right">${dl}${ic('chev')}<input id="date" type="date" value="${sh.date}" max="${todayISO()}" aria-label="Data do gasto"></span></div>
   <div class="keypad" id="kp">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="soft" data-k="," aria-label="vírgula">,</button><button data-k="0">0</button><button class="soft" data-k="bs" aria-label="Apagar dígito">${ic('bs')}</button></div>

/* ---------- interactions ---------- */
function toast(t){V.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{V.toast=null;render()},1800)}
function intKey(cur,k){
  if(k==='c')return'';
  if(k==='bs')return cur.slice(0,-1);
  const n=(cur==='0'?'':cur)+k;return n.length>6?cur:n.replace(/^0+(?=\d)/,'');
}
function toggleCat(o,id){o.sel=o.sel.includes(id)?o.sel.filter(x=>x!==id):[...o.sel,id];o.err=''}
function addCustom(o){
  const el=document.getElementById('newcat');const nome=(el&&el.value||'').trim();
  if(!nome){o.err='Escreve o nome da categoria.';return}
  const all=[...PRESETS,...o.extra];
  if(all.some(c=>c.nome.toLowerCase()===nome.toLowerCase())){o.err='Essa categoria já existe.';return}
  const id='c-'+uid();o.extra.push({id,nome,icon:'tag'});o.sel.push(id);o.err='';
}
function catsFrom(sel,extra){
  const all=[...PRESETS,...extra];
  return sel.map(id=>all.find(c=>c.id===id)).filter(Boolean);
}

function bindOnboarding(){
  root.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;const o=V.ob;
    if(b.dataset.ki!==undefined)o.plafond=intKey(o.plafond,b.dataset.ki);
    else if(b.dataset.sug)o.plafond=b.dataset.sug;
    else if(b.dataset.day)o.dia=+b.dataset.day;
    else if(b.dataset.cat)toggleCat(o,b.dataset.cat);
    else if(b.dataset.newcat!==undefined)addCustom(o);
    else if(b.hasAttribute('data-next'))o.step++;
    else if(b.hasAttribute('data-prev'))o.step--;
    else if(b.hasAttribute('data-finish')){
      S={v:1,config:{plafond:+o.plafond,dia:o.dia,alerta:true,limiar:.9,cats:catsFrom(o.sel,o.extra),tema:'auto'},despesas:[]};
      V.ob=null;persist();render();window.scrollTo(0,0);return;
    }else return;
    render();if(b.hasAttribute('data-next')||b.hasAttribute('data-prev'))window.scrollTo(0,0);
  };
  root.onkeydown=e=>{if(e.key==='Enter'&&e.target.id==='newcat'){addCustom(V.ob);render();const n=document.getElementById('newcat');n&&n.focus()}};
}

function openAdd(x){
  V.sheet=x?{type:'add',id:x.id,amt:x.valor.toFixed(2).replace('.',',').replace(/,00$/,''),cat:x.cat,desc:x.desc||'',date:x.data,err:''}
           :{type:'add',id:null,amt:'',cat:(cats()[0]||{}).id,desc:'',date:todayISO(),err:''};
  render();
}
function amtKey(sh,k){
  let a=sh.amt;
  if(k==='bs')a=a.slice(0,-1);
  else if(k===','){if(!a.includes(','))a=(a||'0')+','}
  else{
    const [i,d]=a.split(',');
    if(d!==undefined){if(d.length>=2)return}else if((i||'').replace(/^0+/,'').length>=5)return;
    a=(a==='0'?'':a)+k;
  }
  sh.amt=a;sh.err='';
}
const amtVal=sh=>round2(parseFloat((sh.amt||'0').replace(',','.'))||0);

function saveAdd(){
  const sh=V.sheet;const v=amtVal(sh);
  sh.desc=(document.getElementById('desc')||{}).value||sh.desc;
  if(v<=0){sh.err='Indica o valor do gasto.';render();return}
  if(!sh.cat){sh.err='Escolhe uma categoria.';render();return}
  const rec={id:sh.id||uid(),data:sh.date,cat:sh.cat,desc:sh.desc.trim(),valor:v,ts:Date.now()};
  if(sh.id){const i=S.despesas.findIndex(x=>x.id===sh.id);if(i>=0){rec.ts=S.despesas[i].ts;S.despesas[i]=rec}}
  else S.despesas.push(rec);
  const cur=cycleFor(todayISO(),S.config.dia);
  const before=round2(compute(cur).total-(sh.id?0:(rec.data>=cur.start&&rec.data<=cur.end?v:0)));
  V.sheet=null;persist();
  const tot=compute(cur).total,pl=S.config.plafond,lim=pl*S.config.limiar;
  let msg=sh.id?'Gasto atualizado':'Gasto registado';
  if(!sh.id&&tot>pl&&before<=pl)msg='Registado · plafond ultrapassado';
  else if(!sh.id&&S.config.alerta&&tot>=lim&&before<lim&&tot<=pl)msg=`Registado · ${Math.round(S.config.limiar*100)}% do plafond`;
  toast(msg);
}

async function doExport(){
  const data=JSON.stringify({app:'Plafond',versao:1,exportado:new Date().toISOString(),dados:S},null,2);
  const name=`plafond-${todayISO()}.json`;
  const blob=new Blob([data],{type:'application/json'});
  try{
    const file=new File([blob],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Cópia de segurança Plafond'});toast('Cópia exportada');return;
    }
  }catch(e){ if(e&&e.name==='AbortError')return; }
  try{
    const u=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),2000);toast('Cópia exportada');
  }catch(e){toast('Não foi possível exportar')}
}
let pendingImport=null;
document.getElementById('importFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{const j=JSON.parse(r.result);const d=normalize(j.dados||j);if(!d)throw 0;
      pendingImport=d;V.sheet={type:'import',n:d.despesas.length};render();
    }catch(err){toast('Ficheiro inválido')}
  };
  r.readAsText(f);
});

function bindApp(){
  // knot position: between hero and dark card
  const h=root.querySelector('.hero');if(h)root.querySelector('.stack').style.setProperty('--kt',(h.offsetHeight+4)+'px');
  root.onclick=e=>{
    const t=e.target;
    if(t.hasAttribute&&t.hasAttribute('data-scrim')){V.sheet=null;render();return}
    const b=t.closest('button');if(!b)return;
    const sh=V.sheet;
    if(b.dataset.tab){V.tab=b.dataset.tab;V.sheet=null;render();window.scrollTo(0,0);return}
    if(b.dataset.act==='add'){openAdd();return}
    if(b.dataset.edit){const x=S.despesas.find(z=>z.id===b.dataset.edit);if(x)openAdd(x);return}
    if(b.hasAttribute('data-close')){V.sheet=null;render();return}
    if(b.dataset.cyc){V.hist.cyc=b.dataset.cyc;V.hist.cat='all';render();return}
    if(b.dataset.fcat){V.hist.cat=b.dataset.fcat;render();return}
    if(sh&&sh.type==='add'){
      if(b.dataset.k){const d=document.getElementById('desc');if(d)sh.desc=d.value;amtKey(sh,b.dataset.k);render();return}
      if(b.dataset.pick){const d=document.getElementById('desc');if(d)sh.desc=d.value;sh.cat=b.dataset.pick;render();return}
      if(b.hasAttribute('data-del')){sh.confirmDel=true;render();return}
      if(b.hasAttribute('data-nodel')){sh.confirmDel=false;render();return}
      if(b.hasAttribute('data-dodel')){S.despesas=S.despesas.filter(x=>x.id!==sh.id);V.sheet=null;persist();toast('Gasto apagado');return}
      if(b.dataset.save==='add'){saveAdd();return}
    }
    if(b.dataset.set){
      const k=b.dataset.set,c=S.config;
      if(k==='plafond')V.sheet={type:'plafond',val:String(c.plafond)};
      else if(k==='dia')V.sheet={type:'dia',val:c.dia};
      else if(k==='alerta'){c.alerta=!c.alerta;persist()}
      else if(k==='cats')V.sheet={type:'cats',sel:c.cats.map(x=>x.id),extra:c.cats.filter(x=>!PRESETS.some(p=>p.id===x.id)),err:''};
      else if(k==='tema')V.sheet={type:'tema'};
      else if(k==='export'){doExport();return}
      else if(k==='import'){document.getElementById('importFile').click();return}
      else if(k==='reset')V.sheet={type:'reset'};
      render();return;
    }
    if(sh&&b.dataset.ki!==undefined){sh.val=intKey(sh.val,b.dataset.ki);render();return}
    if(sh&&b.dataset.day){sh.val=+b.dataset.day;render();return}
    if(sh&&sh.type==='cats'){
      if(b.dataset.cat){toggleCat(sh,b.dataset.cat);render();return}
      if(b.dataset.newcat!==undefined){addCustom(sh);render();return}
    }
    if(b.dataset.tema){S.config.tema=b.dataset.tema;V.sheet=null;persist();render();return}
    if(b.dataset.save){
      const k=b.dataset.save,c=S.config;
      if(k==='plafond'){c.plafond=+sh.val;V.sheet=null;persist();toast('Plafond atualizado');return}
      if(k==='dia'){c.dia=sh.val;V.sheet=null;V.hist.cyc=null;persist();toast('Dia do salário atualizado');return}
      if(k==='cats'){c.cats=catsFrom(sh.sel,sh.extra);V.sheet=null;persist();toast('Categorias guardadas');return}
      if(k==='reset'){S=null;V.sheet=null;V.ob=null;V.tab='inicio';lsSet(null);try{localStorage.removeItem(LS)}catch(e){};document.documentElement.removeAttribute('data-theme');render();return}
      if(k==='import'&&pendingImport){S=pendingImport;pendingImport=null;V.sheet=null;persist();toast('Cópia importada');return}
    }
  };
  const q=document.getElementById('q');
  if(q)q.oninput=()=>{V.hist.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}};
  const dt=document.getElementById('date');
  if(dt)dt.onchange=()=>{if(dt.value&&V.sheet){const d=document.getElementById('desc');if(d)V.sheet.desc=d.value;V.sheet.date=dt.value;render()}};
  const nc=document.getElementById('newcat');
  if(nc)nc.onkeydown=e=>{if(e.key==='Enter'&&V.sheet){addCustom(V.sheet);render();const n=document.getElementById('newcat');n&&n.focus()}};
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&V.sheet){V.sheet=null;render();return}
  const sh=V.sheet;if(!sh||sh.type!=='add')return;
  if(e.target.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key)){amtKey(sh,e.key);render()}
  else if(e.key===','||e.key==='.'){amtKey(sh,',');render()}
  else if(e.key==='Backspace'){amtKey(sh,'bs');render()}
  else if(e.key==='Enter'){saveAdd()}
});
window.addEventListener('resize',()=>{const h=root.querySelector('.hero');const s=root.querySelector('.stack');if(h&&s)s.style.setProperty('--kt',(h.offsetHeight+4)+'px')});

/* ---------- boot ---------- */
S=normalize(lsGet());
render();
askPersist();
window.__plafond={cycleFor,eur,get S(){return S}};
})();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
